name: Download DDColor Models
on: workflow_dispatch

jobs:
  download_files:
    runs-on: ubuntu-latest
    steps:
    - name: Download Real OpenVINO IR Files
      run: |
        mkdir models
        cd models
        # Скачиваем оригинальные рабочие файлы FP16 напрямую из репозитория OpenVINO Notebooks
        curl -L "https://githubusercontent.com" -o ddcolor.xml
        curl -L "https://githubusercontent.com" -o ddcolor.bin

    - name: Check file sizes
      run: |
        ls -lh models/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ddcolor-openvino-fp16
        path: models/
