name: Download DDColor Models
on: workflow_dispatch

jobs:
  download_files:
    runs-on: ubuntu-latest
    steps:
    - name: Download Stable DDColor ONNX
      run: |
        mkdir models
        cd models
        # Скачиваем готовую FP16 ONNX модель напрямую из релизов GitHub
        curl -L "https://github.com" -o ddcolor.onnx

    - name: Check file size
      run: |
        ls -lh models/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ddcolor-onnx-fp16
        path: models/
